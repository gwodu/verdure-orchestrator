name: CI

# CI DOES NOT RUN ON PUSH (since 2026-08-22). Pushing code to GitHub is free.
#
# Why: the Actions budget is real money and nearly spent. Every check this
# workflow performs can now run on the founder's Mac for free — `cargo test`,
# the frontend typecheck+build, the decider and website suites, and a full
# `tauri build`. Paying a runner to repeat work that already passed locally
# buys nothing but a green tick. So GitHub is the code's home, not its compiler:
# commit and push freely, and verify BEFORE pushing (see skills/testing.md).
#
# What still triggers it, both deliberate acts:
#   * pull_request  — the gate before merging to main.
#   * workflow_dispatch — "run CI now" from the Actions tab or `gh workflow run`.
#     This is how you compile-check iOS and Android, which the Mac cannot do.
#
# Escape hatch if push is ever restored: `[skip ci]` in a commit message stops
# GitHub scheduling a run at all (also `[skip actions]`, `[no ci]`).
on:
  pull_request:
    branches: ["*"]
  workflow_dispatch:

# Only the newest run per ref matters. Without this, three quick PR updates queue
# three full builds — and a macOS minute bills at 10x, so a rapid iteration
# session was costing real money for results nobody would read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Monorepo CI, path-filtered so each surface only runs when it (or something it
# depends on) changes. The shared decider (packages/decider) is a dependency of
# BOTH surfaces, so a decider change triggers everything; the root workspace
# files and this workflow are common triggers too.
#
#   - changes:     detect which areas changed (cheap, always runs)
#   - decider-web: the shared decider + the website (Linux)
#   - app-checks:  the cheap Linux checks that need no Rust: the app's frontend
#                  tests (vitest), the release-script tests (Python unittest),
#                  and actionlint over every workflow. Before 2026-10-20 these
#                  ran only by hand, so release-script bugs were found by paying
#                  for tags (testflight-9…11).
#   - porter:      the MVP desktop app on a macOS runner — builds the frontend,
#                  compiles the Tauri Rust backend (cargo test), cross-checks the
#                  x86_64 (Intel) build, and verifies the model-download URLs
#                  resolve. Gated so macOS minutes are spent only when app/ or the
#                  decider change. (Pre-pivot this also ran `brew install --cask
#                  buzz`; the app now runs models in-app, so that step is gone.)
#
#   - sdk:         the Verdure SDK workspace at the repo root (crates/, knowledge/26):
#                  the pure suite (`cargo test --workspace`, seconds, no models) and a
#                  compile-check of the engine features, which builds llama.cpp and
#                  whisper.cpp on the Linux runner. That check is the only place the
#                  feature builds are verified: a second engine build does not fit the
#                  founder's Mac ([OQ-112]). Linux = 1x billing.

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decider_web: ${{ steps.filter.outputs.decider_web }}
      porter: ${{ steps.filter.outputs.porter }}
      app_checks: ${{ steps.filter.outputs.app_checks }}
      sdk: ${{ steps.filter.outputs.sdk }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so paths-filter can diff the actual push (before..after)
          # on branch pushes; a shallow clone leaves it no base and it falls back
          # to treating everything as changed. (PRs diff against the base branch.)
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Left unset deliberately, which is correct for both remaining events:
          #   * pull_request — diffs against the base branch (what the PR changes).
          #   * workflow_dispatch — on `main` (the only branch since 2026-10-20)
          #     there is no diff to make, so every job below ALSO runs whenever
          #     the event is workflow_dispatch: "run CI now" means check everything.
          # The old push-only `base: github.event.before` is gone with the push
          # trigger. It existed because this branch carries months of unmerged
          # work, so without it every filter matched on every push and a
          # three-file docs commit triggered 7.6 minutes of Android compilation.
          filters: |
            common: &common
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            decider_web:
              - *common
              - 'packages/decider/**'
              - 'website/**'
            porter:
              - *common
              - 'packages/decider/**'
              - 'app/**'
            app_checks:
              - *common
              - 'app/src/**'
              - 'app/scripts/**'
              - 'app/package.json'
              - '.github/workflows/**'
            sdk:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'bundles/**'
              - '.github/workflows/ci.yml'

  decider-web:
    name: Decider + website
    needs: changes
    if: ${{ needs.changes.outputs.decider_web == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspaces
        run: npm ci
      - name: Decider tests (the single source of truth)
        run: npm test --workspace @verdure/decider
      - name: Website tests
        run: npm test --workspace nextjs
      - name: Website production build
        run: npm run build --workspace nextjs

  app-checks:
    name: App frontend + release scripts + workflow lint (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.app_checks == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspaces
        run: npm ci
      - name: App frontend tests (vitest)
        run: npm test --workspace @verdure/porter-app
      - name: Release-script tests (Python unittest)
        # -B: no __pycache__. The JWT test signs with the runner's openssl.
        run: python3 -B -m unittest discover -s app/scripts -v
      - name: Lint every workflow (actionlint, pinned)
        # Structure, expressions and contexts only (-shellcheck=): shellcheck's
        # style warnings on long-standing scripts would fail every run for no
        # gain. Pinned to a release tarball, not a moving install script.
        run: |
          curl -sSL -o "$RUNNER_TEMP/al.tgz" https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf "$RUNNER_TEMP/al.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=

  porter:
    name: Desktop porter (macOS)
    needs: changes
    # macOS runners bill at 10x — the single most expensive thing we can run.
    # Most of what this job does is now free on the founder's Mac (`cargo test`,
    # the frontend build, the x86_64 native compile). It earns its cost for ONE
    # thing the Mac cannot do: the **iOS** cross-compile check. Reach for it via
    # workflow_dispatch before tagging `testflight-N` after a long gap, so an
    # iOS break surfaces here rather than inside a signed TestFlight build.
    # (The push gate that used to live here is gone — push no longer triggers
    # this workflow at all; see the header.)
    if: ${{ needs.changes.outputs.porter == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    timeout-minutes: 30
    # Deployment target (10.15, for whisper.cpp's std::filesystem) is forced in
    # app/src-tauri/.cargo/config.toml.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust (native + Intel + iOS cross targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-ios
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          # Keyed on Cargo.lock, not Cargo.toml: the lock is committed (2026-08-21)
          # and is what actually determines the compiled dependency set. Cargo.toml
          # goes stale in BOTH directions — a transitive bump changes the lock while
          # the toml is untouched (stale cache reused), and an unrelated toml edit
          # busts a cache that was still perfectly valid.
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Install workspaces
        run: npm ci
      - name: Frontend typecheck + build
        # Produces app/dist, which tauri's generate_context! embeds at compile time.
        run: npm run build --workspace @verdure/porter-app
      - name: Porter Rust unit tests (compiles the Tauri backend)
        working-directory: app/src-tauri
        run: cargo test
      - name: Cross-compile check for the founder's Intel Mac
        # whisper.cpp (via whisper-rs) is C++ — confirm it compiles for x86_64
        # here (fast) before the full bundle build. This is the pivot's main risk.
        working-directory: app/src-tauri
        run: cargo check --target x86_64-apple-darwin
      - name: Cross-compile check for iOS
        # The cfg(target_os = "ios") code paths otherwise compile only when a
        # testflight-N tag is cut — a breakage would surface days late, at ship
        # time. check-only (no signing, no bundle); the runner's Xcode provides
        # the iOS SDK for whisper/llama's C++.
        working-directory: app/src-tauri
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        run: cargo check --target aarch64-apple-ios
      - name: Verify the model download URLs resolve
        # The models are downloaded on first use from these URLs (model.rs). If a
        # release URL rots, this fails here instead of on a user's machine.
        #
        # The list is READ FROM model.rs rather than repeated here. It used to be
        # a hand-maintained copy, which meant every model added to the registry
        # was silently exempt from the check until someone remembered to paste it
        # in — the check would stay green precisely for the newest, least-proven
        # URL. Deriving it means a new model is covered the moment it is added.
        run: |
          set -euo pipefail
          mapfile -t urls < <(grep -oE 'https://huggingface\.co/[^"]+' app/src-tauri/src/model.rs | sort -u)
          echo "found ${#urls[@]} model URLs in model.rs"
          # Guard the derivation itself: a refactor that moves the URLs would
          # otherwise turn this step into a silent no-op that always passes.
          if [ "${#urls[@]}" -lt 5 ]; then
            echo "::error::Only ${#urls[@]} URLs found in model.rs — the extraction is probably broken, not the registry."
            exit 1
          fi
          for url in "${urls[@]}"; do
            echo "checking $url"
            curl -fsSL -I "$url" >/dev/null
          done

  porter-android:
    name: Porter Android compile check (Linux)
    # The cfg(target_os = "android") paths — JNI mic/storage bridges, procfs
    # probes — otherwise compile only when an android-build-N tag is cut, so a
    # breakage would surface days late. check-only: build scripts compile the
    # whisper/llama C++ with the NDK clang, but nothing is linked or packaged.
    # Linux runner: 1/10 the macOS per-minute cost.
    needs: changes
    if: ${{ needs.changes.outputs.porter == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust (with the Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Point cc at the runner's NDK clang
        # Bare cargo (no tauri CLI) needs the C/C++ cross-compilers named
        # explicitly. android24 matches the min SDK the tag builds target.
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: android-check-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: android-check-cargo-
      - name: Install workspaces
        run: npm ci
      - name: Frontend build (generate_context! requires app/dist)
        run: npm run build --workspace @verdure/porter-app
      - name: Android compile check
        working-directory: app/src-tauri
        run: cargo check --target aarch64-linux-android

  sdk:
    name: SDK crates (Linux)
    needs: changes
    if: ${{ needs.changes.outputs.sdk == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: sdk-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: sdk-cargo-
      - name: Build tools for the engines (cmake, clang)
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake clang
      - name: The pure suite (no models)
        run: cargo test --workspace --locked
      - name: Formatting
        run: cargo fmt --all --check
      - name: Compile-check the engine features (llama.cpp + whisper.cpp)
        # check-only: the C++ is compiled by the sys crates' build scripts, nothing
        # is linked into a final binary. This is [OQ-112]'s answer until the app
        # migrates onto these crates.
        run: cargo check -p verdure-ffi --features llama,whisper --locked
      - name: The developer CLI round-trips a licence and a manifest
        run: |
          set -euo pipefail
          cargo build -q -p verdure-cli
          V=target/debug/verdure
          PUB=$($V license keygen --out "$RUNNER_TEMP/issuer.key" 2>/dev/null)
          TOKEN=$($V license issue --key "$RUNNER_TEMP/issuer.key" --vendor ci --days 1)
          $V license verify --public "$PUB" "$TOKEN" | grep -q '"vendor_id": "ci"'
          cp bundles/manifests/example.json "$RUNNER_TEMP/m.json"
          $V manifest sign --key "$RUNNER_TEMP/issuer.key" "$RUNNER_TEMP/m.json" >/dev/null
          $V manifest verify --public "$PUB" "$RUNNER_TEMP/m.json"
          $V recommend --manifest bundles/manifests/example.json --task chw --tier P1 --ram 2400 --disk 4000 | grep -q chw-forms-P1
          $V grammar bundles/manifests/schema-example-chw.json | grep -q '^root ::='
