name: Build Android APK

on:
  push:
    branches:
      - main
      - cursor/android-apk-build-ae2f
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973'
          log-accepted-android-sdk-licenses: false
      
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.0.0' --locked
      
      - name: Initialize Android project
        working-directory: ./app
        run: cargo tauri android init --ci
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
      
      - name: Build Android APK
        working-directory: ./app
        run: cargo tauri android build --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: verdure-android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Upload APK info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: |
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.json
          if-no-files-found: ignore
