name: Build Android for Play (.aab, signed)

# The Play-distribution build ([OQ-66]): same app as the test-APK workflow
# (build-android.yml), but packaged as a Play-ready Android App Bundle (.aab)
# signed with the PERSISTENT upload key (a GitHub secret, founder-owned — the
# same trust model as the iOS App Store Connect keys). Google Play App Signing
# takes it from here: we upload signed with our UPLOAD key, Play re-signs the
# per-device APKs with the app signing key it holds.
#
# This is the analog of build-testflight.yml on the Android side; the throwaway
# test-APK path stays for quick sideload smoke tests.
#
# First run: download the .aab artifact and upload it by hand in Play Console to
# create the app + establish Play App Signing. Automating the upload (a Play
# service account) comes after the app exists.
#
# Required repository secrets (founder generates the keystore, holds the key):
#   ANDROID_KEYSTORE_BASE64  — base64 of the upload keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD — store password
#   ANDROID_KEY_ALIAS         — key alias inside the keystore
#   ANDROID_KEY_PASSWORD      — key password
#
# Runs on Linux runners — 1/10 the per-minute cost of the macOS ones.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (alpha = CLOSED testing, which is what counts toward production access)"
        type: choice
        default: alpha
        options: [alpha, beta, internal, production]
  push:
    tags:
      - "android-play-*"

jobs:
  build:
    name: Package Verdure for Play (.aab, signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check the signing secrets are present
        # Fail fast with a clear message instead of an opaque jarsigner error.
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty. Add the upload keystore + password secrets (see the header of this workflow) before building for Play."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Rust (with the Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Point the build at the runner's Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK at: $ANDROID_NDK_LATEST_HOME"
      - name: Cache cargo build
        # Same reasoning as build-android.yml: without this the NDK recompiles
        # llama.cpp + whisper.cpp from scratch every run (~19 min measured on the
        # sibling APK job). Added before first use so the Play path never pays
        # that bill. Its own key — a .aab release build, distinct from the APK's.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: android-aab-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: android-aab-cargo-
      - name: Install workspaces
        run: npm ci
      - name: Generate the Android project (tauri android init)
        working-directory: app
        run: npx tauri android init --ci
      - name: Show the generated project (ground truth for iteration)
        run: |
          MAIN_ACTIVITY=$(find app/src-tauri/gen/android -name "MainActivity.kt" | head -1)
          echo "===== $MAIN_ACTIVITY ====="; cat "$MAIN_ACTIVITY"
      - name: Install Verdure's app icons into the generated project
        # `tauri <platform> init` scaffolds from Tauri's template, which ships
        # TAURI's logo — and gen/ is regenerated every build, so src-tauri/icons
        # was never consulted. Every build before 2026-08-14 shipped the wrong
        # icon on both platforms. Fails the build rather than shipping it again.
        run: python3 app/scripts/install-icons.py
      - name: Patch the Android project (mic permission + audio-context init)
        # Shared with build-android.yml — one script, no drift.
        env:
          # Play rejects a repeated versionCode, and the template defaults to 1.
          # run_number only ever increases. See patch-android-project.py.
          VERDURE_ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: python3 app/scripts/patch-android-project.py
      - name: Build the App Bundle (release, aarch64)
        # Single ABI (arm64-v8a) — covers modern phones; Play serves it to those
        # devices. Add armeabi-v7a / x86_64 targets here later for wider reach.
        # Gradle's bundleRelease emits an UNSIGNED .aab (no signingConfig); we
        # sign it externally below, matching the test-APK path's approach.
        working-directory: app
        run: npx tauri android build --aab --target aarch64
      - name: Sign the App Bundle with the upload key
        # AABs use JAR signing (jarsigner), not apksigner. Play verifies this
        # upload-key signature, then re-signs the delivered APKs with the app
        # signing key it holds (Play App Signing).
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB=$(find app/src-tauri/gen/android -name "*.aab" -path "*release*" | head -1)
          echo "aab: $AAB"
          test -n "$AAB"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload.keystore
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB" "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$AAB"
          cp "$AAB" verdure-release.aab
          rm -f upload.keystore
      - name: Publish to Google Play
        # Restores the pipeline's "one tag -> three platforms" property for
        # Android (KNOWLEDGE.md 2026-08-12): iOS already auto-uploads to
        # TestFlight, and this is the Android equivalent.
        #
        # Talks to Google's API through our own script rather than a marketplace
        # action, because this step holds a credential that can publish to the
        # founder's Play account - see the header of publish-to-play.py.
        #
        # SKIPS (without failing) when the secret is absent, because the FIRST
        # bundle of a new app must be uploaded by hand in Play Console - Google's
        # API refuses it. The artifact step below is what that manual upload uses.
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          TRACK: ${{ github.event.inputs.track || 'alpha' }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set - skipping the automated upload."
            echo "::notice::Download the verdure-android-play artifact and upload it in Play Console."
            echo "::notice::Required for the FIRST upload of a new app; set the secret to automate the rest."
            exit 0
          fi
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          # Prove the script and its inputs are sane before opening an edit on Play.
          python3 app/scripts/publish-to-play.py \
            --aab verdure-release.aab --package ai.verdure.app --track "$TRACK" --dry-run
          python3 app/scripts/publish-to-play.py \
            --aab verdure-release.aab --package ai.verdure.app --track "$TRACK"

      - name: Upload the signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: verdure-android-play
          path: verdure-release.aab
          if-no-files-found: error
          # 14 days, not the 90-day default: this is a PRIVATE repo, so artifact
          # storage bills as GB-months. These builds are installed within a day
          # or two and are always reproducible from the tag.
          retention-days: 14
