name: Build desktop app (Intel macOS)

# On-demand packaging: build a runnable .app/.dmg on an INTEL macOS runner so it
# runs natively on the founder's x86_64 Mac (GitHub's default macОС runner is now
# Apple Silicon). This is how we ship a runnable app WITHOUT compiling locally —
# no Xcode, no Command Line Tools, no disk for a toolchain. Download the artifact
# and run it. See app/README.md.
on:
  # workflow_dispatch works once this is on the default branch. Until then, push
  # a tag like `app-build-1` to trigger a one-shot build from any branch.
  workflow_dispatch:
  push:
    tags:
      - "app-build-*"

jobs:
  build:
    name: Package Verdure (.app + .dmg)
    runs-on: macos-13 # Intel runner → x86_64 build for the founder's 2019 Mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install workspaces
        run: npm ci
      - name: Build the app bundle
        # tauri build runs beforeBuildCommand (npm run build) to produce the
        # frontend, then compiles the Rust backend and packages .app + .dmg.
        # Unsigned (no Apple Developer cert) — first launch needs the quarantine
        # flag cleared; see the job summary / app/README.md.
        working-directory: app
        run: npx tauri build
      - name: Upload the runnable app
        uses: actions/upload-artifact@v4
        with:
          name: verdure-porter-macos-intel
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
