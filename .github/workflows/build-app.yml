name: Build desktop app (macOS, universal)

# On-demand packaging of the SIGNED, NOTARIZED macOS app — the one you hand to
# someone else. The founder's own test builds are made locally for free
# (`cd app && npm run tauri build`); this job exists for the signature.
#
# UNIVERSAL since 2026-08-22 ([OQ-76]). It was x86_64-only, which was right while
# the only test machine was a 2019 Intel Mac and wrong for everyone else: every
# Mac sold since Nov 2020 is Apple Silicon, and an Intel build there runs under
# Rosetta with llama.cpp's ARM NEON kernels disabled and — via the x86_64 branch
# [OQ-71] added — Metal off too. A new Mac would have run Verdure slower than the
# old one it was built for. Now both slices ship; macOS loads the native one.
# Measured cost: binary 15 MB -> 30 MB, .app 16 MB -> 30 MB, .dmg 11 MB. No
# runtime penalty — only the matching slice is ever loaded.
# Build time roughly doubles (llama.cpp/whisper.cpp compile twice); acceptable
# for a build cut once per release rather than per push.
on:
  # workflow_dispatch works once this is on the default branch. Until then, push
  # a tag like `app-build-2` to trigger a one-shot build from any branch.
  # `release-N` is the ship-everywhere tag: one tag triggers this + TestFlight +
  # the Android APK together, so no platform silently goes stale (the 2026-08-12
  # incident: iOS sat three weeks behind because only per-platform tags existed).
  # The per-platform tags remain for single-platform iteration.
  workflow_dispatch:
  push:
    tags:
      - "app-build-*"
      - "release-*"

jobs:
  build:
    name: Package Verdure (.app + .dmg)
    runs-on: macos-latest # Apple Silicon — available immediately; we cross-build
    timeout-minutes: 60 # a hung macOS job would otherwise bill 6h at 10x
    # Deployment target (10.15, for whisper.cpp's std::filesystem) is forced in
    # app/src-tauri/.cargo/config.toml so it can't be overridden by cargo's
    # per-target default.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust (both macOS architectures)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - name: Install workspaces
        run: npm ci
      - name: Cache cargo + compiled C++ (whisper.cpp / llama.cpp)
        # Without this, every tag build recompiles whisper.cpp and llama.cpp from
        # source — that is the bulk of a 12-45 minute macOS build, billed at 10x.
        # Keyed on the manifest + target, so it only rebuilds when deps change.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          # Keyed on Cargo.lock, not Cargo.toml: the lock is committed (2026-08-21)
          # and is what actually determines the compiled dependency set. Cargo.toml
          # goes stale in BOTH directions — a transitive bump changes the lock while
          # the toml is untouched (stale cache reused), and an unrelated toml edit
          # busts a cache that was still perfectly valid.
          key: ${{ runner.os }}-universal-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-universal-
      - name: Check for signing credentials
        # Signing is OPTIONAL: without the Developer ID secrets the build still
        # produces a working (unsigned) app, exactly as before. This job must not
        # start failing the day before those secrets exist.
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing + notarization ENABLED"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERTIFICATE not set — building UNSIGNED. Users will need 'xattr -cr' to open it."
          fi
      - name: Stage the notarization key
        # Reuses the SAME App Store Connect key the TestFlight workflow uses —
        # notarytool accepts it, so notarization needs no new secrets. Only the
        # Developer ID *signing* certificate is new.
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_API_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Build the universal app bundle
        # tauri build runs beforeBuildCommand (npm run build) for the frontend,
        # then builds BOTH architectures and lipos them into one universal binary.
        #
        # With the signing env set, the Tauri bundler ALSO code-signs with the
        # Developer ID cert (hardened runtime + Entitlements.plist — the mic
        # entitlement is required or dictation breaks on a notarized build), then
        # submits to Apple's notary service and staples the ticket. The result
        # opens with a double-click: no Gatekeeper warning, no `xattr -cr`.
        #
        # Without those secrets it builds unsigned exactly as before.
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.ASC_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          # Update signing (knowledge/23) — a minisign keypair, SEPARATE from the
          # Apple identity above. Tauri signs the .app.tar.gz with the private
          # half; the app verifies with the public half compiled into it, so an
          # update cannot be swapped by whoever hosts the file. Absent, the build
          # still succeeds and simply produces no updater artifacts.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin
      - name: Check the updater artifacts were produced
        # `createUpdaterArtifacts` is config; the signing key is a secret. Config
        # without key = a release that silently cannot be updated, discoverable
        # only much later on a user's machine. Fail loudly here instead.
        run: |
          B=app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            test -f "$B"/*.app.tar.gz || { echo "::error::no .app.tar.gz — updates would be impossible for this release"; exit 1; }
            test -f "$B"/*.app.tar.gz.sig || { echo "::error::updater artifact is unsigned; the app will reject it"; exit 1; }
            echo "updater artifacts present and signed ✓"
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set — this build cannot be offered as an update (knowledge/23)"
          fi
      - name: Generate latest.json for the updater
        # The manifest the app polls (knowledge/23). Generated rather than
        # hand-written because the signature is a long base64 blob and a single
        # wrong character makes every client silently reject the update — a
        # failure that presents as "nobody ever updated", with no error anywhere.
        if: hashFiles('app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig') != ''
        env:
          # darwin-universal covers both architectures from the single bundle.
          # Also verdureai.com, for the same reason as the endpoint itself: the
          # tarball URL is embedded in latest.json, which old clients keep reading.
          RELEASES_BASE: https://verdureai.com/updates
        run: |
          B=app/src-tauri/target/universal-apple-darwin/release/bundle/macos
          python3 - "$B" > latest.json <<'PYEOF'
          import datetime, glob, json, os, sys
          bundle = sys.argv[1]
          sig = open(glob.glob(f"{bundle}/*.app.tar.gz.sig")[0]).read().strip()
          tarball = os.path.basename(glob.glob(f"{bundle}/*.app.tar.gz")[0])
          version = json.load(open("app/src-tauri/tauri.conf.json"))["version"]
          base = os.environ["RELEASES_BASE"]
          print(json.dumps({
              "version": version,
              "notes": "See the release page for what changed.",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": {
                  "darwin-universal": {"signature": sig, "url": f"{base}/{tarball}"}
              },
          }, indent=2))
          PYEOF
          echo "--- latest.json ---"; cat latest.json
      - name: Notarize and staple the .dmg itself
        # Tauri notarizes and staples the .APP, then creates and merely SIGNS the
        # .dmg around it — so the wrapper is never notarized. That gap is
        # invisible when you check the .app (which passes) and fatal when a user
        # double-clicks the download: Gatekeeper assesses the DMG and rejects it
        # with "Apple cannot check it for malicious software", which is the exact
        # warning notarization exists to remove.
        #
        # Caught 2026-08-28 on the shipped v0.1.0 by testing the released bytes
        # rather than the CI artifact: the .app said "accepted / Notarized
        # Developer ID", the .dmg said "rejected / Unnotarized Developer ID".
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          DMG=$(find app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name "*.dmg" | head -1)
          test -n "$DMG"
          echo "notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$ASC_API_KEY_ID" \
            --issuer "$ASC_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
      - name: Verify the signature and notarization
        # Proof, not hope: `spctl` is what Gatekeeper itself runs, and `stapler
        # validate` proves the ticket travels with the artifact offline. The icon
        # bug taught us to check the artifact, not the intent.
        #
        # BOTH are asserted. Checking only the .app is what let an unnotarized
        # .dmg ship in v0.1.0 — the DMG is the thing a user actually opens, and
        # it needs `--type open`, not `--type execute`.
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APP=$(find app/src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          DMG=$(find app/src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name "*.dmg" | head -1)
          echo "verifying app: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          echo "verifying dmg: $DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          xcrun stapler validate "$DMG"
          echo "app AND dmg signed, notarized, and stapled - OK"
      - name: Verify the release contract
        # The independent check. The step above asserts specific facts; this one
        # runs the same contract a human would run against a published release,
        # INCLUDING positive controls that prove spctl and strings are actually
        # working — so "all green" cannot mean "the instruments are broken".
        #
        # It is not redundant with the step above: that verifies what we believed
        # to check, this verifies what the user receives. The v0.1.0 DMG passed
        # every check we had and was still rejected by Gatekeeper.
        if: steps.signing.outputs.enabled == 'true'
        run: |
          python3 app/scripts/verify-release.py \
            --dir app/src-tauri/target/universal-apple-darwin/release/bundle \
            --latest-json latest.json
      - name: Upload the runnable app
        uses: actions/upload-artifact@v4
        with:
          name: verdure-macos-universal
          path: |
            app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            latest.json
          if-no-files-found: error
          # 14 days, not the 90-day default: this is a PRIVATE repo, so artifact
          # storage bills as GB-months. These builds are installed within a day
          # or two and are always reproducible from the tag.
          retention-days: 14
