name: TestFlight (signed, upload to App Store Connect)

# Signed iOS build → uploaded to TestFlight. THE iOS build path: code-signed with
# the founder's paid Apple Developer account, delivered through TestFlight (no
# 7-day sideload expiry). It replaced the unsigned sideload workflow
# (build-ipad.yml, retired 2026-08-12 — in git history if ever needed).
#
# BOUNDARY: this workflow never contains any credentials. It reads six GitHub
# repository SECRETS the founder creates once (Settings → Secrets and variables →
# Actions). Claude never sees their values.
#   ASC_API_KEY_P8          — contents of the App Store Connect API key .p8 file
#   ASC_API_KEY_ID          — that key's Key ID
#   ASC_API_ISSUER_ID       — the App Store Connect API Issuer ID
#   APPLE_TEAM_ID           — the 10-char Apple Developer Team ID
#   IOS_DIST_CERT_P12       — base64 of ONE "Apple Distribution" certificate
#                             exported as .p12 (with its private key)
#   IOS_DIST_CERT_PASSWORD  — the password chosen when exporting that .p12
#
# SIGNING (2026-10-08): every build signs with that SAME certificate. Automatic
# signing used to mint a new certificate per run — a runner's keychain is empty,
# so Xcode could never reuse one — until Apple refused at the account limit
# (release-14). Now nothing here can create a certificate; ios-signing.py only
# replaces one App Store profile named "Verdure CI App Store". The certificate
# expires after a year: export a fresh .p12 and update the two secrets then.
#
# One-time account setup (see knowledge/11 + the session hand-off):
#   1. App Store Connect → register the Bundle ID `ai.verdure.porter` (explicit).
#   2. Create the app record with that bundle ID.
#   3. Users and Access → Integrations → App Store Connect API → generate a key
#      with the "App Manager" role; download the .p8 ONCE; note Key ID + Issuer ID.
#   4. Add the four secrets above.
# Then tag `testflight-N` to ship a build. Internal testers install immediately;
# external testers need a one-time Beta App Review.
on:
  # `release-N` ships all three platforms from one tag (see build-app.yml's note);
  # `testflight-N` remains for iOS-only iteration.
  workflow_dispatch:
  push:
    tags:
      - "testflight-*"
      - "release-*"

env:
  IPHONEOS_DEPLOYMENT_TARGET: "14.0"
  # Must match the bundle ID of the "Verdure AI" App Store Connect record, which
  # is the explicit App ID `ai.verdure.porter.898PY37K5S` (= ai.verdure.porter +
  # Team ID; a tool made this "unique" variant). We override PRODUCT_BUNDLE_IDENTIFIER
  # at archive time, so only the iOS/TestFlight build uses it — the macOS build and
  # tauri.conf.json's `ai.verdure.porter` are untouched. (Cleaning up the two-App-ID
  # situation belongs with the identifier rename, [OQ-60].)
  BUNDLE_ID: ai.verdure.porter.898PY37K5S

# One at a time, never cancelled mid-run: two runs at once would delete each other's signing profile (ios-signing.py replaces ONE named profile).
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build signed + upload to TestFlight
    runs-on: macos-latest # full Xcode + signing toolchain
    timeout-minutes: 60 # a hung macOS job would otherwise bill 6h at 10x
    steps:
      - uses: actions/checkout@v4
      # Signing first: a missing secret, revoked cert or API refusal then fails
      # in about a minute, before the Rust build bills 10x minutes for nothing.
      - name: Stage the App Store Connect API key
        # Write the .p8 secret to the location xcodebuild + altool look for it.
        # Never printed; lives only on the ephemeral runner for this job.
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8 ~/private_keys/
      - name: Import the ONE distribution certificate into a temporary keychain
        # The same certificate every run, so no build ever creates one. The keychain
        # password is random per run and never leaves this job.
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          test -n "$IOS_DIST_CERT_P12" || { echo "::error::IOS_DIST_CERT_P12 secret is not set — see the header of this workflow"; exit 1; }
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 24)
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | xargs)
          rm -f "$RUNNER_TEMP/dist.p12"
          # The public half, so ios-signing.py can find this cert's id on the account.
          security find-certificate -c "Apple Distribution" -p "$KEYCHAIN" > "$RUNNER_TEMP/dist-cert.pem"
          test -s "$RUNNER_TEMP/dist-cert.pem" || { echo "::error::the .p12 holds no 'Apple Distribution' certificate"; exit 1; }
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Fetch the App Store profile for that certificate
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          export ASC_API_KEY_P8_PATH=~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          PROFILE=$(python3 app/scripts/ios-signing.py \
            --bundle-id "$BUNDLE_ID" \
            --cert-pem "$RUNNER_TEMP/dist-cert.pem" \
            --require-entitlement com.apple.developer.kernel.increased-memory-limit \
            --require-entitlement com.apple.developer.kernel.extended-virtual-addressing)
          echo "profile: $PROFILE"
          echo "PROFILE_NAME=$PROFILE" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust (with the iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Install workspaces
        run: npm ci
      - name: Cache cargo + compiled C++ (whisper.cpp / llama.cpp)
        # Without this, every tag build recompiles whisper.cpp and llama.cpp from
        # source — that is the bulk of a 12-45 minute macOS build, billed at 10x.
        # Keyed on the manifest + target, so it only rebuilds when deps change.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          # Keyed on Cargo.lock, not Cargo.toml: the lock is committed (2026-08-21)
          # and is what actually determines the compiled dependency set. Cargo.toml
          # goes stale in BOTH directions — a transitive bump changes the lock while
          # the toml is untouched (stale cache reused), and an unrelated toml edit
          # busts a cache that was still perfectly valid.
          key: ${{ runner.os }}-ios-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ios-
      - name: Build the frontend
        working-directory: app
        run: npm run build
      - name: Generate the iOS project (tauri ios init)
        working-directory: app
        run: npx tauri ios init --ci
      - name: Install Verdure's app icons into the generated project
        # `tauri <platform> init` scaffolds from Tauri's template, which ships
        # TAURI's logo — and gen/ is regenerated every build, so src-tauri/icons
        # was never consulted. Every build before 2026-08-14 shipped the wrong
        # icon on both platforms. Fails the build rather than shipping it again.
        run: python3 app/scripts/install-icons.py
      - name: Pre-build the Rust library for iOS
        # Build the staticlib (whisper.cpp + llama.cpp for aarch64-apple-ios) with
        # cargo DIRECTLY, in production mode (custom-protocol → embed the UI, not
        # the dev server). Why not Xcode's generated "Build Rust Code" phase: that
        # phase phones home to a parent `tauri ios build` process that doesn't
        # exist under bare xcodebuild — and `tauri ios build` hard-requires
        # signing. Without custom-protocol the shipped app looks for a dev server
        # (observed on-device, ipad-build-3).
        working-directory: app/src-tauri
        run: cargo build --lib --release --target aarch64-apple-ios --features tauri/custom-protocol
      - name: Point the Xcode project at the prebuilt library
        working-directory: app/src-tauri/gen/apple
        run: |
          python3 - <<'PY'
          import re
          spec = open("project.yml").read()
          copy = (
              "set -e; "
              "for d in \"${SRCROOT}/Externals/arm64/${CONFIGURATION}\" \"${SRCROOT}/Externals\"; do "
              "mkdir -p \"$d\"; "
              "cp \"${SRCROOT}/../../target/aarch64-apple-ios/release/libverdure_porter_lib.a\" \"$d/libapp.a\"; "
              "done"
          )
          new, n = re.subn(r"script:.*tauri ios xcode-script.*", "script: " + copy, spec)
          assert n >= 1, "no tauri xcode-script line found in project.yml"
          open("project.yml", "w").write(new)
          print(f"replaced {n} script line(s)")
          PY
          brew install xcodegen
          xcodegen generate
      - name: Patch Info.plist — mic permission, build number, encryption compliance
        # After xcodegen so it can't be wiped. CFBundleVersion must increase per
        # upload → use the run number. ITSAppUsesNonExemptEncryption=false declares
        # we use only standard HTTPS/TLS (exempt), skipping the manual export-
        # compliance question on every TestFlight upload.
        run: |
          # Single source: the mic text lives in the macOS partial Info.plist
          # (app/src-tauri/Info.plist) and is READ from there — editing the copy
          # the user sees updates every platform's prompt from one place.
          MIC_TEXT=$(/usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" app/src-tauri/Info.plist)
          test -n "$MIC_TEXT" # fail loudly if the owner file ever loses the key
          for plist in $(find app/src-tauri/gen/apple -maxdepth 2 -name Info.plist); do
            echo "patching $plist"
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC_TEXT" "$plist" \
              || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $MIC_TEXT" "$plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$plist" \
              || /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"
            /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$plist" \
              || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$plist"
            # Dictation keeps running when the user switches apps (knowledge/11,
            # "Mobile non-negotiables"): the audio background mode is what lets an
            # open microphone session continue off-screen. A reply being written
            # is covered separately by UIApplication.beginBackgroundTask
            # (background.rs). Unverified on a device until the next TestFlight
            # build ([OQ-116]).
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist" | grep -q audio \
              || /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$plist"
            /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$plist" | grep -q audio || { echo "::error::UIBackgroundModes lacks audio in $plist"; exit 1; }
          done
      - name: Patch entitlements — raise the memory ceiling (Qwen3.8 27B experiment)
        # Without this, iPadOS kills the app (jetsam) well below physical RAM, and
        # the 27B's ~10 GB can't load even on a 16 GB iPad ([OQ-84]). The first
        # key raises the per-app memory limit; the second lets llama.cpp map an
        # 8.8 GB file into the address space. Both are ticked once on the App ID in
        # the developer portal (Apple's API can't enable them); ios-signing.py's
        # --require-entitlement flags above stop the build early if the profile
        # lacks them. Remove this step AND those flags to end the experiment.
        run: |
          ENTS=$(find app/src-tauri/gen/apple -maxdepth 2 -name "*.entitlements")
          test -n "$ENTS" # tauri ios init must have generated one; fail loudly if not
          for e in $ENTS; do
            echo "patching $e"
            for key in com.apple.developer.kernel.increased-memory-limit com.apple.developer.kernel.extended-virtual-addressing; do
              /usr/libexec/PlistBuddy -c "Add :$key bool true" "$e" \
                || /usr/libexec/PlistBuddy -c "Set :$key true" "$e"
            done
          done
      - name: Archive (manual signing with the stored certificate)
        # Manual, not Automatic: automatic signing archives with a DEVELOPMENT
        # identity, which on a fresh runner means minting a new certificate.
        # Command-line settings outrank every level in the project, so the plain
        # CODE_SIGN_IDENTITY is enough. Do NOT add the sdk-conditional form here:
        # xcodebuild splits `CODE_SIGN_IDENTITY[sdk=iphoneos*]=…` at the first `=`
        # and looks for an identity named "iphoneos*]=Apple Distribution"
        # (testflight-11). The prebuilt-lib link settings match the unsigned build.
        working-directory: app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          SCHEME=$(xcodebuild -project "$PROJ" -list | sed -n '/Schemes:/,$p' | sed -n '2p' | xargs)
          echo "project: $PROJ  scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build-ios/Verdure.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            LIBRARY_SEARCH_PATHS='$(inherited) '"$PWD/src-tauri/target/aarch64-apple-ios/release" \
            OTHER_LDFLAGS='$(inherited) -framework AudioToolbox -framework CoreAudio -framework AVFoundation -framework Accelerate' \
            archive
      - name: Export a signed App Store .ipa
        working-directory: app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key><string>export</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build-ios/Verdure.xcarchive \
            -exportPath build-ios/export \
            -exportOptionsPlist ExportOptions.plist
      - name: Verify the exported .ipa (the artifact, not the project)
        # The profile check (ios-signing.py --require-entitlement) proves Apple
        # WOULD grant the entitlements; this proves the signed app CARRIES them,
        # with the right identity, before anything is uploaded. Remove the two
        # kernel keys here when the 27B experiment ends ([OQ-84]).
        working-directory: app
        run: |
          IPA=$(find build-ios/export -maxdepth 1 -name "*.ipa" | head -1)
          test -n "$IPA"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa"
          unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          codesign --verify --strict "$APP"
          codesign -d --entitlements :- "$APP" 2>/dev/null > "$RUNNER_TEMP/ents.plist"
          python3 - "$RUNNER_TEMP/ents.plist" "$APP/Info.plist" "$BUNDLE_ID" <<'PYEOF'
          import plistlib, sys
          raw = open(sys.argv[1], "rb").read()
          ents = plistlib.loads(raw) if raw.strip() else {}  # unsigned/no entitlements -> report, not crash
          info = plistlib.load(open(sys.argv[2], "rb"))
          want = ["com.apple.developer.kernel.increased-memory-limit",
                  "com.apple.developer.kernel.extended-virtual-addressing"]
          bad = [k for k in want if ents.get(k) is not True]
          if info.get("CFBundleIdentifier") != sys.argv[3]:
              bad.append(f"CFBundleIdentifier={info.get('CFBundleIdentifier')!r}")
          print("entitlements:", sorted(k for k in ents if k.startswith("com.apple.developer")))
          print("bundle id:", info.get("CFBundleIdentifier"), "| min iOS:", info.get("MinimumOSVersion"))
          sys.exit(f"the signed app is wrong: {bad}" if bad else 0)
          PYEOF
      - name: Upload to TestFlight
        working-directory: app
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA=$(find build-ios/export -maxdepth 1 -name "*.ipa" | head -1)
          echo "uploading: $IPA"
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
      - name: Keep the signed .ipa as an artifact too
        uses: actions/upload-artifact@v4
        with:
          name: verdure-testflight-signed
          path: app/build-ios/export/*.ipa
          if-no-files-found: error
          # 14 days, not the 90-day default: this is a PRIVATE repo, so artifact
          # storage bills as GB-months. These builds are installed within a day
          # or two and are always reproducible from the tag.
          retention-days: 14
