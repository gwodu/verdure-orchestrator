name: Build iPad test app (unsigned IPA)

# The iPad TEST VEHICLE ([OQ-65], knowledge/11 deviation note): builds the Tauri
# app for iOS (aarch64-apple-ios) and packages an UNSIGNED .ipa. This exists to
# test the chat/transcription stack (the ByteShape 4B, [OQ-64]) on the founder's
# iPad while his 8 GB Mac can't — it is NOT the shippable iOS product (that
# strategy is knowledge/11's thin-decider-over-Apple's-stack).
#
# Unsigned on purpose: no Apple Developer cert in CI. Install by re-signing on
# the user side with a free Apple ID (Sideloadly / AltStore, 7-day cert) — see
# knowledge/21 "How to build / ship".
#
# Separate workflow from build-app.yml so the verified Mac pipeline is untouched.
on:
  workflow_dispatch:
  push:
    tags:
      - "ipad-build-*"

env:
  # whisper.cpp/ggml use C++17 std::filesystem — comfortably covered by iOS 14,
  # and every iPad that could run these models is far newer.
  IPHONEOS_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    name: Package Verdure for iPad (.ipa, unsigned)
    runs-on: macos-latest # full Xcode preinstalled — the toolchain the Mac lacks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust (with the iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - name: Install workspaces
        run: npm ci
      - name: Build the frontend
        # xcodebuild is invoked directly below (to control signing), so Tauri's
        # beforeBuildCommand never runs — build the dist/ it embeds here.
        working-directory: app
        run: npm run build
      - name: Generate the iOS project (tauri ios init)
        # Creates app/src-tauri/gen/apple (Xcode project + Info.plist). Generated
        # fresh each build — nothing under gen/ is committed, so the desktop
        # checkout stays clean and there's no stale project to rot.
        working-directory: app
        run: npx tauri ios init --ci
      - name: Add the microphone permission string
        # Same NSMicrophoneUsageDescription as the macOS partial Info.plist
        # (app/src-tauri/Info.plist): without it, iOS terminates the app the
        # instant live transcription touches the mic instead of prompting.
        run: |
          MIC_TEXT="Verdure transcribes your microphone into text entirely on your computer. Your audio is never uploaded or stored anywhere else."
          found=0
          for plist in $(find app/src-tauri/gen/apple -maxdepth 2 -name Info.plist); do
            echo "patching $plist"
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC_TEXT" "$plist" \
              || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $MIC_TEXT" "$plist"
            found=1
          done
          [ "$found" = "1" ] # fail loudly if the generated layout ever changes
      - name: Pre-build the Rust library for iOS
        # Build the staticlib with cargo DIRECTLY — whisper.cpp + llama.cpp cross-
        # compiled for aarch64-apple-ios. Done here (not in Xcode's generated
        # "Build Rust Code" phase) because that phase phones home to a parent
        # `tauri ios build` process (a server-addr file) that doesn't exist under
        # bare xcodebuild — and `tauri ios build` itself hard-requires signing.
        # The frontend dist/ (built above) is embedded at this compile step.
        # --features tauri/custom-protocol is what separates a PRODUCTION build
        # (embedded assets) from a DEV build (loads http://localhost:1420): tauri's
        # build script emits dev=true unless this feature is on, and the tauri CLI
        # normally adds it for you — bare cargo doesn't. Without it the app ships
        # looking for a dev server (seen on-device, ipad-build-3).
        working-directory: app/src-tauri
        run: cargo build --lib --release --target aarch64-apple-ios --features tauri/custom-protocol
      - name: Point the Xcode project at the prebuilt library
        # Replace the generated tauri xcode-script phase with a copy of the
        # prebuilt .a into the exact spots the template's linker settings expect
        # (Externals/<arch>/<config>), then regenerate the project. Print the spec
        # first so a failure here leaves the ground truth in the log.
        working-directory: app/src-tauri/gen/apple
        run: |
          echo "===== project.yml (generated by tauri ios init) ====="
          cat project.yml
          echo "====================================================="
          # Rewrite the script line in place: prebuilt copy instead of xcode-script.
          python3 - <<'PY'
          import re
          spec = open("project.yml").read()
          # Ground truth from run 28709260194's link line: the template links
          # `-lapp` and searches Externals/arm64/<config> — the prebuilt lib must
          # be COPIED AS libapp.a (the template renames every crate's lib to that).
          copy = (
              "set -e; "
              "for d in \"${SRCROOT}/Externals/arm64/${CONFIGURATION}\" \"${SRCROOT}/Externals\"; do "
              "mkdir -p \"$d\"; "
              "cp \"${SRCROOT}/../../target/aarch64-apple-ios/release/libverdure_porter_lib.a\" \"$d/libapp.a\"; "
              "done"
          )
          new, n = re.subn(r"script:.*tauri ios xcode-script.*", "script: " + copy, spec)
          assert n >= 1, "no tauri xcode-script line found in project.yml"
          open("project.yml", "w").write(new)
          print(f"replaced {n} script line(s)")
          PY
          brew install xcodegen
          xcodegen generate
      - name: Re-add the microphone permission string
        # xcodegen regenerate can rewrite project references; re-assert the plist
        # key so it can't be lost between generate passes.
        run: |
          MIC_TEXT="Verdure transcribes your microphone into text entirely on your computer. Your audio is never uploaded or stored anywhere else."
          for plist in $(find app/src-tauri/gen/apple -maxdepth 2 -name Info.plist); do
            /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC_TEXT" "$plist" \
              || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $MIC_TEXT" "$plist"
          done
      - name: Build for iOS, unsigned
        # xcodebuild now only compiles the thin Swift shell and links the prebuilt
        # Rust lib. Signing is disabled; the user re-signs at install time
        # (Sideloadly/AltStore). Extra LIBRARY_SEARCH_PATHS covers the prebuilt .a
        # wherever the template resolves it from; OTHER_LDFLAGS adds the audio
        # frameworks cpal needs on iOS (mic capture) that the template doesn't list.
        working-directory: app
        run: |
          PROJ=$(ls -d src-tauri/gen/apple/*.xcodeproj | head -1)
          echo "project: $PROJ"
          SCHEME=$(xcodebuild -project "$PROJ" -list | sed -n '/Schemes:/,$p' | sed -n '2p' | xargs)
          CONFIG=$(xcodebuild -project "$PROJ" -list | sed -n '/Build Configurations:/,/^$/p' | grep -i release | head -1 | xargs)
          echo "scheme: $SCHEME  config: $CONFIG"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -sdk iphoneos \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LIBRARY_SEARCH_PATHS='$(inherited) '"$PWD/src-tauri/target/aarch64-apple-ios/release" \
            OTHER_LDFLAGS='$(inherited) -framework AudioToolbox -framework CoreAudio -framework AVFoundation -framework Accelerate' \
            build
      - name: Package the unsigned .ipa
        # An .ipa is just Payload/<app>.app zipped — that's all sideloading tools
        # need; they re-sign the binary themselves.
        working-directory: app
        run: |
          APP=$(find build-ios/Build/Products -maxdepth 2 -name "*.app" -type d | head -1)
          echo "app bundle: $APP"
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry verdure-ipad-unsigned.ipa Payload
      - name: Upload the iPad test build
        uses: actions/upload-artifact@v4
        with:
          name: verdure-ipad-unsigned
          path: app/verdure-ipad-unsigned.ipa
          if-no-files-found: error
