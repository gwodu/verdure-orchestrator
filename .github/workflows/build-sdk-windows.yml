name: Build SDK for Windows (x64 library + Python and Kotlin bindings + CLI), tested where it is built

# The Verdure SDK as a Windows vendor receives it (knowledge/26, "Windows"):
# verdure.dll for x64 with whisper.cpp and llama.cpp compiled in, the UniFFI
# Python and Kotlin bindings, the developer CLI, the sandbox credentials and the
# example manifest, zipped.
#
# Nobody on the team has a Windows machine, so this workflow is also the test
# bench. It does not stop at "it compiled": the SDK suite runs on Windows, the
# built file is inspected, and then the ZIP — unpacked into a clean folder — is
# driven from Python and Kotlin the way a vendor's developer would drive it:
# a real download, a known recording, a known question, model files placed by
# hand with the network blocked, and a delete. See bindings/tests/.
#
# Windows runners bill at 2x. Trigger: `git tag sdk-windows-N && git push origin
# sdk-windows-N`, or dispatch. Not on push, not on PR.
on:
  push:
    tags: ["sdk-windows-*"]
  workflow_dispatch:

concurrency:
  group: sdk-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-lib:
    name: verdure.dll (x86_64-pc-windows-msvc), built and tested
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
      # A short target folder: llama.cpp's build tree is deep, and MSBuild's
      # file tracker fails past 260 characters whatever the registry says.
      CARGO_TARGET_DIR: C:/vt
      # whisper.cpp otherwise compiles for the BUILD MACHINE's processor
      # (GGML_NATIVE defaults ON when not cross-compiling; whisper-rs-sys passes
      # GGML_* through to CMake). A runner with AVX-512 would ship a library
      # that dies with an illegal instruction on most customers' PCs. OFF gives
      # the fixed AVX2 level llama-cpp-sys-2 already builds at; pe_check.py
      # reads both CMake caches and fails the run if either says otherwise.
      GGML_NATIVE: "OFF"
      # No Visual C++ Redistributable on the customer's PC: Rust and both
      # engines link the C/C++ runtime statically. The two settings must agree
      # (mixing /MT and /MD objects fails at link with LNK2038).
      LLAMA_STATIC_CRT: "1"
      # /FORCE:MULTIPLE: whisper.cpp and llama.cpp each carry their own ggml, so
      # every gguf_*/ggml_* symbol is defined twice — the same thing the Android
      # build answers with --allow-multiple-definition ([OQ-114]). The linker
      # keeps the first; both engines are then run for real below.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static -C link-arg=/FORCE:MULTIPLE"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      KIT: C:/vk/verdure-windows-x64
    steps:
      - name: Keep every file byte for byte
        # Git for Windows defaults to rewriting line endings on checkout; the
        # manifest's signature covers its exact bytes. `.gitattributes` says the
        # same for anyone who clones; the step after checkout proves it does.
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: The signed files arrive unchanged, even with git's Windows default
        run: |
          set -euo pipefail
          if grep -q $'\r' bundles/manifests/example.json; then echo "::error::example.json has CRLF line endings; its signature cannot verify"; exit 1; fi
          # Control: in a repository WITHOUT our .gitattributes, autocrlf=true does
          # rewrite a file on its way out — so the check below can see a rewrite.
          C="$RUNNER_TEMP/crlf-control"; rm -rf "$C"; mkdir -p "$C"; ( cd "$C" && git init -q . && printf 'a\nb\n' > f.txt && git -c core.autocrlf=false add f.txt && git -c core.autocrlf=true checkout-index --prefix=out/ f.txt )
          grep -q $'\r' "$C/out/f.txt" || { echo "::error::control failed: autocrlf=true did not add CRLF, so this check proves nothing"; exit 1; }
          # The real thing: this repository, checked out the way a Windows developer's git would.
          git -c core.autocrlf=true checkout-index --prefix="$RUNNER_TEMP/crlf-check/" bundles/manifests/example.json bundles/manifests/example.json.sig bundles/sandbox.token crates/verdure-ffi/keys/issuer.pub
          if grep -rq $'\r' "$RUNNER_TEMP/crlf-check"; then echo "::error::.gitattributes does not protect the signed files from autocrlf"; exit 1; fi
          cmp "$RUNNER_TEMP/crlf-check/bundles/manifests/example.json" bundles/manifests/example.json
          echo "signed files are byte-identical under core.autocrlf=true"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Tools the engine builds need
        run: |
          set -euo pipefail
          cmd //c ver
          rustc -vV | grep -E 'release|host'
          cmake --version | head -1
          python --version
          java -version 2>&1 | head -1
          # bindgen (both engine crates) loads libclang; the runner image ships LLVM.
          if [ -f "C:/Program Files/LLVM/bin/libclang.dll" ]; then
            echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          else
            echo "::error::libclang.dll not found under C:/Program Files/LLVM/bin; bindgen cannot generate the engine bindings"; exit 1
          fi
          python -c "import os,platform;print('processor:',platform.processor(),'| cores:',os.cpu_count())"
      - name: Restore cargo cache
        # restore/save split so a run that fails in a LATER step still saves the
        # engine compile (the Android workflow learned this at 1x; here it is 2x).
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            C:/vt
          key: sdk-windows-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: sdk-windows-cargo-
      - name: The checks' own tests
        run: python -B -m unittest discover -s bindings/tests -v
      - name: The SDK suite on Windows (no models)
        run: cargo test --workspace --locked --target "$TARGET"
      - name: The developer tool round-trips a licence and a manifest
        run: |
          set -euo pipefail
          cargo build -q -p verdure-cli --locked --target "$TARGET"
          V="$CARGO_TARGET_DIR/$TARGET/debug/verdure.exe"
          rm -f "$RUNNER_TEMP/issuer.key"
          PUB=$("$V" license keygen --out "$RUNNER_TEMP/issuer.key" 2>/dev/null | tr -d '\r')
          TOKEN=$("$V" license issue --key "$RUNNER_TEMP/issuer.key" --vendor ci --days 1 | tr -d '\r')
          "$V" license verify --public "$PUB" "$TOKEN" | grep -q '"vendor_id": "ci"'
          cp bundles/manifests/example.json "$RUNNER_TEMP/m.json"
          "$V" manifest sign --key "$RUNNER_TEMP/issuer.key" "$RUNNER_TEMP/m.json" >/dev/null
          "$V" manifest verify --public "$PUB" "$RUNNER_TEMP/m.json"
          "$V" recommend --manifest bundles/manifests/example.json --task chw --tier P1 --ram 2400 --disk 4000 | grep -q chw-forms-P1
          "$V" grammar bundles/manifests/schema-example-chw.json | grep -q '^root ::='
          # The COMMITTED manifest against the COMMITTED signature and key, as checked out here.
          ISSUER=$(tr -d '\r\n' < crates/verdure-ffi/keys/issuer.pub)
          "$V" manifest verify --public "$ISSUER" bundles/manifests/example.json
          # Control: one byte more and the same check must fail.
          cp bundles/manifests/example.json "$RUNNER_TEMP/t.json"; cp bundles/manifests/example.json.sig "$RUNNER_TEMP/t.json.sig"; printf ' ' >> "$RUNNER_TEMP/t.json"
          if "$V" manifest verify --public "$ISSUER" "$RUNNER_TEMP/t.json" 2>/dev/null; then echo "::error::a changed manifest verified; the check above proves nothing"; exit 1; fi
          # The device as this tool reads it.
          "$V" capabilities --data-dir "$RUNNER_TEMP" | tee /dev/stderr | grep -q '"os": "windows"'
      - name: A new signing key goes to the user's folder (PowerShell, no HOME — as a Windows developer runs it)
        shell: pwsh
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "profile"
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $work = Join-Path $env:RUNNER_TEMP "somewhere-else"
          New-Item -ItemType Directory -Force $work | Out-Null
          Push-Location $work
          & "$env:CARGO_TARGET_DIR/$env:TARGET/debug/verdure.exe" license keygen | Out-Null
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { Write-Host "::error::keygen failed"; exit 1 }
          if (-not (Test-Path (Join-Path $env:USERPROFILE ".verdure/issuer.key"))) { Write-Host "::error::the key is not under USERPROFILE"; exit 1 }
          if (Test-Path (Join-Path $work ".verdure")) { Write-Host "::error::the key was written into the working folder"; exit 1 }
          Write-Host "key written under USERPROFILE, nothing in the working folder"
      - name: Build the library with both engines, and the CLI
        run: |
          set -euo pipefail
          cargo build --release -p verdure-ffi --features llama,whisper --target "$TARGET" --locked
          cargo build --release -p verdure-cli --target "$TARGET" --locked
          ls -l "$CARGO_TARGET_DIR/$TARGET/release/verdure.dll" "$CARGO_TARGET_DIR/$TARGET/release/verdure.exe"
      - name: Save cargo cache (even if a later check fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            C:/vt
          key: sdk-windows-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
      - name: An engine-less library (the control), and the bindings generated from the real one
        run: |
          set -euo pipefail
          DLL="$CARGO_TARGET_DIR/$TARGET/release/verdure.dll"
          cargo build -p verdure-ffi --locked --target "$TARGET"
          cargo run -p verdure-ffi --features bindgen --bin uniffi-bindgen --locked --target "$TARGET" -- generate --library "$DLL" --language python --out-dir out/python
          cargo run -p verdure-ffi --features bindgen --bin uniffi-bindgen --locked --target "$TARGET" -- generate --library "$DLL" --language kotlin --out-dir out/kotlin
          test -s out/python/verdure.py
          test -s out/kotlin/uniffi/verdure/verdure.kt
          test -s "$CARGO_TARGET_DIR/$TARGET/debug/verdure.dll"
      - name: Verify the library a vendor receives (the file, with controls)
        run: |
          python bindings/tests/pe_check.py \
            --dll "$CARGO_TARGET_DIR/$TARGET/release/verdure.dll" \
            --exe "$CARGO_TARGET_DIR/$TARGET/release/verdure.exe" \
            --build-dir "$CARGO_TARGET_DIR/$TARGET/release/build" \
            --engineless "$CARGO_TARGET_DIR/$TARGET/debug/verdure.dll" \
            --control C:/Windows/System32/kernel32.dll
      - name: Package what a vendor receives, then unpack it somewhere clean
        id: package
        run: |
          set -euo pipefail
          D=out/verdure-windows-x64
          R="$CARGO_TARGET_DIR/$TARGET/release"
          mkdir -p "$D/lib" "$D/python" "$D/kotlin" "$D/bin" "$D/bundles" "$D/tests"
          cp "$R/verdure.dll" "$D/lib/"
          cp "$R/verdure.dll" out/python/verdure.py "$D/python/"
          cp -r out/kotlin/uniffi "$D/kotlin/"
          cp "$R/verdure.exe" "$D/bin/"
          cp bundles/manifests/example.json bundles/manifests/example.json.sig bundles/manifests/schema-*.json bundles/sandbox.token crates/verdure-ffi/keys/issuer.pub "$D/bundles/"
          cp bindings/tests/sdk_smoke.py bindings/tests/Smoke.kt "$D/tests/"
          cp docs/sdk-integration-guide.md "$D/"
          cp bindings/windows/README.md "$D/README.md"
          cp docs/sdk-changelog.md "$D/CHANGELOG.md"
          echo "commit ${GITHUB_SHA} · $(date -u +%Y-%m-%dT%H:%MZ) · $(rustc --version) · built and tested on $(cmd //c ver | tr -d '\r\n')" > "$D/VERSION"
          (cd out && 7z a -tzip -bso0 -bsp0 verdure-windows-x64.zip verdure-windows-x64)
          # From here on the ZIP is tested, not the build tree: what was packed is what runs.
          rm -rf C:/vk C:/vd && mkdir -p C:/vk C:/vd
          (cd C:/vk && 7z x -bso0 -bsp0 "$GITHUB_WORKSPACE/out/verdure-windows-x64.zip")
          cmp "$KIT/python/verdure.dll" "$R/verdure.dll"
          ls -l out/verdure-windows-x64.zip "$KIT" "$KIT/python" "$KIT/lib" "$KIT/bin"
          cat "$KIT/VERSION"
      - name: Fetch the known recording
        run: |
          set -euo pipefail
          curl -sSL --retry 3 -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.7.4/samples/jfk.wav
          GOT=$(sha256sum < "$RUNNER_TEMP/jfk.wav" | cut -d' ' -f1)
          test "$GOT" = "59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e" || { echo "::error::jfk.wav is not the file the test expects ($GOT)"; exit 1; }
      - name: The zip's CLI runs from the zip
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -euo pipefail
          "$KIT/bin/verdure.exe" manifest verify --public "$(tr -d '\r\n' < "$KIT/bundles/issuer.pub")" "$KIT/bundles/example.json"
          "$KIT/bin/verdure.exe" recommend --manifest "$KIT/bundles/example.json" --task scribe --pace live --tier L2 --ram 6000 --disk 20000
          "$KIT/bin/verdure.exe" capabilities
      - name: "Customer path, online: Python against the zip (download, shared store, recording, question, form, search, delete)"
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          python -I "$KIT/tests/sdk_smoke.py" --binding "$KIT/python" --assets "$KIT/bundles" \
            --data-dir C:/vd/online --audio "$RUNNER_TEMP/jfk.wav" --mode online \
            --also-bundle auto --export-bundles C:/vd/seed --awkward-path --require-engines \
            --report out/smoke-online.json
      - name: "Customer path, offline: Python's network blocked, model files placed by hand"
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          # Block THIS Python at the firewall, so "nothing leaves the device" is
          # observed rather than promised. The script's first check is a control:
          # a request from the same program must fail, or the run proves nothing.
          $py = (Get-Command python).Source
          Write-Host "blocking outbound traffic for $py"
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled True
          New-NetFirewallRule -DisplayName "verdure-ci-block-python" -Direction Outbound -Program $py -Action Block | Out-Null
          $code = 1
          try {
            python -I "$env:KIT/tests/sdk_smoke.py" --binding "$env:KIT/python" --assets "$env:KIT/bundles" `
              --data-dir C:/vd/offline --audio "$env:RUNNER_TEMP/jfk.wav" --mode preplaced `
              --seed-from C:/vd/seed --awkward-path --require-engines --expect-no-network `
              --report out/smoke-offline.json
            $code = $LASTEXITCODE
          } finally {
            Remove-NetFirewallRule -DisplayName "verdure-ci-block-python"
          }
          exit $code
      - name: "Kotlin on a desktop JVM against the zip (JNA finds verdure.dll; load, ask, delete)"
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $T = $env:RUNNER_TEMP
          Invoke-WebRequest https://github.com/JetBrains/kotlin/releases/download/v2.1.20/kotlin-compiler-2.1.20.zip -OutFile "$T/kotlinc.zip"
          Expand-Archive "$T/kotlinc.zip" -DestinationPath $T -Force
          Invoke-WebRequest https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar -OutFile "$T/jna.jar"
          Invoke-WebRequest https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/1.9.0/kotlinx-coroutines-core-jvm-1.9.0.jar -OutFile "$T/coroutines.jar"
          & "$T/kotlinc/bin/kotlinc.bat" "$env:KIT/kotlin/uniffi/verdure/verdure.kt" "$env:KIT/tests/Smoke.kt" -cp "$T/jna.jar;$T/coroutines.jar" -include-runtime -nowarn -d "$T/smoke.jar"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the Kotlin binding did not compile"; exit 1 }
          java "-Djna.library.path=$env:KIT/lib" -cp "$T/smoke.jar;$T/jna.jar;$T/coroutines.jar" SmokeKt "$env:KIT/bundles" "C:/vd/kotlin" "C:/vd/seed"
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the Kotlin run failed"; exit 1 }
      - name: What the checks said
        if: always()
        run: |
          python - <<'PYEOF'
          import glob, json, os
          lines = ["## Verdure SDK on Windows — what ran", ""]
          for path in sorted(glob.glob("out/smoke-*.json")):
              rep = json.load(open(path, encoding="utf-8"))
              lines += [f"### {rep['mode']} ({rep['platform']})", "", "| | check | detail |", "|---|---|---|"]
              for r in rep["results"]:
                  detail = str(r.get("detail", "")).replace("|", "\\|").replace("\n", " ")[:400]
                  lines.append(f"| {r['status'].upper()} | {r['name']} | {detail} |")
              lines.append("")
          if len(lines) == 2:
              lines.append("No customer-path report was written: the run stopped before those steps.")
          open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8").write("\n".join(lines) + "\n")
          PYEOF
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verdure-windows-x64-reports
          path: out/smoke-*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload the zip (only when everything above passed)
        uses: actions/upload-artifact@v4
        with:
          name: verdure-windows-x64
          path: out/verdure-windows-x64.zip
          retention-days: 14
          if-no-files-found: error
