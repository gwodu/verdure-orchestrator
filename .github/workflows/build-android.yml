name: Build Android test app (APK)

# The Android TEST VEHICLE ([OQ-66], knowledge/11 update note): cross-compiles
# the app — llama.cpp + whisper.cpp included — for aarch64-linux-android via the
# NDK and packages a test-signed .apk. Same shared Rust core and GGUF flow as
# macOS/iOS (NOT MediaPipe); same-branch cfg(target_os = "android") gating.
#
# Signed with a THROWAWAY key generated per run — fine for sideload smoke tests,
# but each build is "a different app" to Android: uninstall the old one before
# installing a new build. Play-Console distribution (the shareable testing link)
# comes later with a persistent upload keystore held as a GitHub secret.
#
# Runs on Linux runners — 1/10 the per-minute cost of the macOS ones.
on:
  # `release-N` ships all three platforms from one tag (see build-app.yml's note);
  # `android-build-N` remains for Android-only iteration. The Play .aab workflow
  # is NOT on release-* — it stays manual until the signing secrets exist.
  workflow_dispatch:
  push:
    tags:
      - "android-build-*"
      - "release-*"

jobs:
  build:
    name: Package Verdure for Android (.apk, test-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Rust (with the Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Point the build at the runner's Android NDK
        # ubuntu-latest images ship the SDK + an NDK; tauri's cargo integration
        # reads NDK_HOME / ANDROID_NDK_HOME.
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK at: $ANDROID_NDK_LATEST_HOME"
      - name: Cache cargo build
        # This job had NO cache until 2026-08-22 and so recompiled llama.cpp and
        # whisper.cpp through the NDK on every single run — measured at 18.9
        # minutes for release-14, the most expensive Linux job we run and second
        # only to the macOS packaging overall. The C++ dominates that time and
        # changes only when the pinned crates do, so it caches well.
        # Key is separate from ci.yml's `android-check-cargo-*`: that job runs
        # `cargo check` (metadata only), this one `cargo build --release`, and
        # sharing a key would let the cheaper artifacts evict the expensive ones.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/src-tauri/target
          key: android-apk-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: android-apk-cargo-
      - name: Install workspaces
        run: npm ci
      - name: Generate the Android project (tauri android init)
        # Creates app/src-tauri/gen/android (Gradle project + manifest). Generated
        # fresh each build — nothing under gen/ is committed (same policy as iOS).
        working-directory: app
        run: npx tauri android init --ci
      - name: Show the generated project (ground truth for iteration)
        # If a later step fails, the log carries exactly what the template looks
        # like — the same practice that got the iOS build green in 3 rounds.
        run: |
          find app/src-tauri/gen/android -maxdepth 4 -name "AndroidManifest.xml" -o -maxdepth 4 -name "MainActivity.kt" -o -maxdepth 3 -name "*.gradle*" | head -20
          MAIN_MANIFEST=$(find app/src-tauri/gen/android -path "*app/src/main/AndroidManifest.xml" | head -1)
          echo "===== $MAIN_MANIFEST ====="; cat "$MAIN_MANIFEST"
          MAIN_ACTIVITY=$(find app/src-tauri/gen/android -name "MainActivity.kt" | head -1)
          echo "===== $MAIN_ACTIVITY ====="; cat "$MAIN_ACTIVITY"
      - name: Install Verdure's app icons into the generated project
        # `tauri <platform> init` scaffolds from Tauri's template, which ships
        # TAURI's logo — and gen/ is regenerated every build, so src-tauri/icons
        # was never consulted. Every build before 2026-08-14 shipped the wrong
        # icon on both platforms. Fails the build rather than shipping it again.
        run: python3 app/scripts/install-icons.py
      - name: Patch the Android project (mic permission + audio-context init)
        # Shared with build-android-play.yml — one script so the mic wiring can't
        # drift between the test-APK and the signed-AAB build paths.
        run: python3 app/scripts/patch-android-project.py
      - name: Build the APK (release, aarch64)
        # The tauri CLI drives gradle + cargo itself (it is the parent process, so
        # there's no orphaned-build-script problem like iOS's xcode-script). It
        # also runs beforeBuildCommand (npm run build) for the frontend dist.
        working-directory: app
        run: npx tauri android build --apk --target aarch64
      - name: Sign with a throwaway test key
        # Gradle's release APK is unsigned (no keystore configured). zipalign +
        # apksigner make it installable. The key is generated per run — see the
        # header note about uninstalling between builds.
        run: |
          APK=$(find app/src-tauri/gen/android -name "*.apk" -path "*release*" | head -1)
          echo "apk: $APK"
          test -n "$APK"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          keytool -genkeypair -keystore test.keystore -alias verdure -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass verduretest -keypass verduretest \
            -dname "CN=Verdure Test"
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks test.keystore --ks-pass pass:verduretest \
            --key-pass pass:verduretest --out verdure-android-test.apk aligned.apk
          "$BT/apksigner" verify verdure-android-test.apk
      - name: Upload the Android test build
        uses: actions/upload-artifact@v4
        with:
          name: verdure-android-test
          path: verdure-android-test.apk
          if-no-files-found: error
          # 14 days, not the 90-day default: this is a PRIVATE repo, so artifact
          # storage bills as GB-months. These builds are installed within a day
          # or two and are always reproducible from the tag.
          retention-days: 14
