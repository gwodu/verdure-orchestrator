# The MVP desktop porter — the Rust backend. This is the "porter" half of the
# decider+porter: given a tool the (shared) decider picked, install it from its
# official source and launch it, in one click. See knowledge/17-build-plan.md.
#
# This crate declares its own [workspace] so it is NOT absorbed into the
# repo-root Cargo workspace (the long-term pure-Rust core under /src). The MVP
# porter is intentionally separate; it grows toward that core later (knowledge/14).

[package]
name = "verdure-porter"
version = "0.1.0"
description = "Verdure — the local AI conductor (desktop porter)."
authors = ["Verdure"]
edition = "2021"

[workspace]

[lib]
# Tauri convention: shared logic lives in a lib so it can also target mobile
# later. The desktop binary (main.rs) is a thin shell over `run()`.
name = "verdure_porter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Transcription engine: whisper.cpp compiled into this binary (knowledge/18 —
# wrap the model, not a separate app). default-features = false keeps it plain
# CPU (no Metal/CUDA) — right for the founder's Intel Mac and clean to
# cross-compile. Needs cmake at build time (present on CI macOS runners).
whisper-rs = { version = "0.16", default-features = false }
# Pure-Rust audio decoding (no ffmpeg): mp3/m4a/wav/flac → samples for whisper.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "wav", "pcm", "flac"] }
# Local chat LLM (the conversational front door, knowledge/18): llama.cpp compiled
# in, like whisper. default-features = false keeps `native`/-march=native disabled
# (it would break the x86_64 cross-build) and the grammar samplers available via
# the "common" feature.
#
# ⚠️ It does NOT disable Metal, despite what this comment claimed until 2026-08-21.
# `llama-cpp-sys-2`'s build script turns GGML_METAL off for watchOS only; every
# other Apple target inherits llama.cpp's cmake default of ON. Combined with
# `LlamaModelParams::default()` (n_gpu_layers = -1, i.e. offload everything), that
# meant chat ran on the GPU — and on a 2019 Intel Mac Metal returns WRONG NUMBERS
# rather than failing, which is the whole of [OQ-71]. The backend is now chosen
# explicitly in `llm.rs::model_params()`; do not re-assert "plain CPU" here.
llama-cpp-2 = { version = "0.1.150", default-features = false, features = ["common"] }
# Live (microphone) capture for streaming transcription: pure-Rust, cross-platform
# audio I/O (CoreAudio on macOS). No external tool, cross-compiles cleanly to
# x86_64 (no -march=native). We only use the input side. See live.rs.
cpal = "0.15"

# Self-update for the DESKTOP app only. iOS and Android get updates from their
# stores, so the plugin is scoped to desktop targets — pulling it into the mobile
# builds would add a code path that can never run there.
#
# Verdure's update check is OPT-IN (knowledge/06 — no telemetry): a check is a
# network request that reveals someone runs Verdure and roughly when, so the user
# is asked once, on first launch, and can decline entirely and still update by
# hand from the header. See `main.ts` (the consent prompt) and knowledge/23.
# NOTE: this predicate must be spelled out for CARGO, which resolves dependencies
# before Tauri's build script runs and therefore does not know `cfg(desktop)`.
# `[target.'cfg(desktop)'.dependencies]` silently matches nothing and the plugin
# never gets compiled in — which surfaces later as "Permission updater:default
# not found" from tauri-build, a confusing way to learn it. The Rust-side
# `#[cfg(desktop)]` in lib.rs IS valid, because tauri-build defines that cfg.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Needed to relaunch after an update is installed; the updater swaps the bundle
# on disk but the running process is still the old one until it restarts.
tauri-plugin-process = "2"

# iPad test build only ([OQ-65], knowledge/11 deviation note): iOS apps cannot
# spawn processes, so the macOS shell-outs (curl / sysctl / vm_stat / df) need
# in-process replacements there. Scoped to non-macOS so the verified Mac build's
# dependency tree is byte-identical. The cfg matches the code's cfg gates exactly
# (model.rs `download`, device.rs `ios` module).
[target.'cfg(not(target_os = "macos"))'.dependencies]
# In-process HTTPS download (rustls — no OpenSSL to cross-compile).
ureq = { version = "2", default-features = false, features = ["tls"] }
# Audited syscall wrappers: sysctlbyname (RAM), statvfs (disk). skills/testing.md
# FFI rule 1 — reach C through audited wrapper crates, don't hand-write bindings.
libc = "0.2"

# Android-only ([OQ-66]). cpal's Android backend (oboe) enumerates the mic over
# JNI and reads the app's JavaVM + Context from the process-global `ndk_context`.
# Tauri v2 does NOT populate that global, so opening the mic panics "android
# context was not initialized" (the verdure-live thread dies → the UI hangs on
# "preparing" until the watchdog). We initialize it ourselves from MainActivity
# — see lib.rs `Java_..._initAudioContext` + the MainActivity patch in
# build-android.yml. Our use is decoupled from cpal's via raw pointers, so the
# jni version is independent; `ndk-context = 0.1` unifies with cpal's global.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
# The `test` feature exposes tauri::test (MockRuntime, mock_builder,
# get_ipc_response) so we can invoke the real command handlers headlessly in CI.
tauri = { version = "2", features = ["test"] }
